name: Locutronik Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Expire Orders
        run: |
          curl -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET_TOKEN }}" \
            --max-time 60 \
            -w "\nHTTP: %{http_code} | Time: %{time_total}s\n" \
            "https://locutronik-bk.onrender.com/api/cron/expire-orders/"

      - name: Send Pending Emails
        run: |
          curl -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET_TOKEN }}" \
            --max-time 60 \
            -w "\nHTTP: %{http_code} | Time: %{time_total}s\n" \
            "https://locutronik-bk.onrender.com/api/cron/send-pending-emails/"

      - name: Sync MP Payments
        run: |
          curl -X POST \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET_TOKEN }}" \
            --max-time 60 \
            -w "\nHTTP: %{http_code} | Time: %{time_total}s\n" \
            "https://locutronik-bk.onrender.com/api/cron/sync-mp-payments/"
